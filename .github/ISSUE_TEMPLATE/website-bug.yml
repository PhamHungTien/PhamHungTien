name: Website problem
description: Something on phamhungtien.com looks wrong, is broken or hard to use.
labels: [website, bug]
body:
  - type: input
    id: url
    attributes:
      label: Page
      description: The address of the page where you saw the problem.
      placeholder: https://phamhungtien.com/vTTS/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 16, Safari 26 / macOS 26, Chrome 142
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [Dark, Light, Not sure]
