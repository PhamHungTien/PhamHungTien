# Monthly, grouped dependency updates. Each pull request runs the full deploy checks
# (format, types, Firestore rules, build, verify) before anything reaches main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check pins TypeScript 5–6; take the next major together with Astro.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      firebase:
        patterns: ['firebase', 'firebase-tools', '@firebase/*']
      tooling:
        patterns:
          [
            'prettier',
            'prettier-plugin-*',
            'typescript',
            '@fontsource/*',
            'opentype.js',
            'sharp',
            '@lucide/*',
            'lucide-*',
          ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
