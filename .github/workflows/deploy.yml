name: Deploy website

# Builds the Astro site and publishes it to the gh-pages branch, which GitHub Pages
# serves behind Cloudflare. scripts/deploy-local.sh publishes the same tree by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Checks run with a read-only token; only the publish job on main can write.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run check

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore security rules
        run: npm run test:rules

      - name: Build
        run: npm run build
        env:
          # Used to resolve the latest release downloads at build time.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SEO, links and images
        run: npm run verify

      - name: Verify canonical languages and legacy redirects
        run: npm run test:language

      - name: Keep the built site for the publish job
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 3

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          # gh-pages holds generated output only; each deploy replaces it wholesale.
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
