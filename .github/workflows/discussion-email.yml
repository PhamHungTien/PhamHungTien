name: Discussion email digest

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send one configuration test to the fixed owner address'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: discussion-email-digest
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test notification behavior
        run: node --test scripts/notifications/digest.test.mjs
      - name: Send explicitly requested owner configuration test
        if: github.event_name == 'workflow_dispatch' && inputs.send_test
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
        run: node scripts/notifications/send-test.mjs
      - name: Restore notification baseline
        uses: actions/cache/restore@v4
        with:
          path: .notification-state
          key: discussion-email-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: discussion-email-v1-
      - name: Collect public discussion changes and send one digest
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
        run: node scripts/notifications/digest.mjs
      - name: Save notification baseline
        uses: actions/cache/save@v4
        with:
          path: .notification-state
          key: discussion-email-v1-${{ github.run_id }}-${{ github.run_attempt }}
